# Battle royale study roster.
#
# 39 enabled games plus 4 disabled ones whose battle royale is only a mode.
# Twitch labels are matched case-insensitively and merged, so listing one casing
# catches the others.
#
# Fields:
#   game_id       stable key, also used by `ytc --games`
#   twitch_names  every Twitch label to merge into this game
#   yt_query      the `q` sent to search.list; tighten it if title_match stays under 70%
#   match_terms   looked up in title, tags and description to confirm a video
#   release_date  to be filled in by the team (SPEC section 14)
#   valid_from    Twitch months before this one belong to another game (Warzone)
#   role          precursor | leader | follower | mode
#   enabled       set to false to leave a game out of collection
#
# yt_query, match_terms and enabled can be tuned directly in the database:
# `ytc prepare-games` never overwrites them on an existing row.
# Roles are a first pass and should be reviewed by the team.

study: battle_royale
title: Battle royale
description: Battle royale titles present in the Twitch top 200 between 2016-01 and 2024-09.
window:
  months_before_first: 12
  months_after_last: 6
games:
- game_id: fortnite
  game_name: Fortnite
  twitch_names:
  - Fortnite
  - Fortnite Zero Build
  yt_query: '"Fortnite"'
  match_terms:
  - Fortnite
  release_date: null
  role: leader
  enabled: true
  notes: The Twitch category covers every mode (Save the World, Creative, Zero Build), not only battle
    royale.
- game_id: pubg
  game_name: PUBG
  twitch_names:
  - PLAYERUNKNOWN'S BATTLEGROUNDS
  - 'PUBG: BATTLEGROUNDS'
  yt_query: '"PUBG"'
  match_terms:
  - PUBG
  - PLAYERUNKNOWN
  - BATTLEGROUNDS
  release_date: null
  role: leader
  enabled: true
  notes: First rows in 2016-09, before the 2017-03 early access. To be checked by the team.
