services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ytc
      POSTGRES_PASSWORD: ytc
      POSTGRES_DB: ytc
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ytc"]
      interval: 2s
      timeout: 3s
      retries: 20

  collector:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://ytc:ytc@db:5432/ytc
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YTC_STUDY: ${YTC_STUDY:-battle_royale}
    env_file:
      - path: .env
        required: false
