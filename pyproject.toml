[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytcollector"
version = "0.1.0"
description = "YouTube collector for the Procom Steam/Twitch trend study"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "pyarrow>=14",
    "typer>=0.12",
    "pyyaml>=6",
    "python-dotenv>=1",
    "ftfy>=6.1",
    "python-slugify>=8",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    # Read-only web view (outside SPEC section 13's scope, added on request).
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "responses>=0.25",
    "ruff>=0.5",
    "httpx>=0.27",
]

[project.scripts]
ytc = "ytcollector.cli:app"

[tool.setuptools.packages.find]
include = ["ytcollector*"]

[tool.setuptools.package-data]
ytcollector = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
